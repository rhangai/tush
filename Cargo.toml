[package]
name = "tush"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
enum_dispatch = "0.3"
figment = { version = "0.10.19", features = ["yaml"] }
libc = "0.2"
parking_lot = "0.12.5"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_with = "3.23.0"
tokio = { version = "^1.52", features = ["full"] }
tokio-util = "0.7"
