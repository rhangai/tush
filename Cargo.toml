[package]
name = "tush"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
arc-swap = "1.9"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
enum_dispatch = "0.3"
figment = { version = "0.10.19", features = ["yaml"] }
libc = "0.2"
parking_lot = "0.12.5"
petgraph = { version = "0.8", default-features = false, features = ["std"] }
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_with = { version = "3.23.0", features = ["smallvec_1"] }
smallvec = { version = "1.16", features = ["serde"] }
smol_str = { version = "0.3.6", features = ["serde"] }
tokio = { version = "^1.52", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7"
unicode-width = "0.2.2"
